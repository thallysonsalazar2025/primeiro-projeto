name: Concurso Intelligence CI

on:
  pull_request:
    paths:
      - "concurso-intelligence/**"
      - "index.html"
      - "questions-*.js"
      - ".github/workflows/concurso-intelligence-ci.yml"
  push:
    branches:
      - master
    paths:
      - "concurso-intelligence/**"
      - "index.html"
      - "questions-*.js"
      - ".github/workflows/concurso-intelligence-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concurso-intelligence
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concurso_ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck and validate Prisma schema
        run: npm run quality
      - name: Build production application
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concurso-intelligence
    env:
      SESSION_SECRET: ci-session-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --tag concurso-intelligence:ci .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concurso_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d concurso_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: concurso-intelligence
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concurso_ci
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Deploy migrations into fresh E2E database
        run: npx prisma migrate deploy
      - name: Import and validate preserved DATAPREV legacy dataset
        run: npm run db:import:dataprev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            concurso-intelligence/test-results
            concurso-intelligence/playwright-report
          if-no-files-found: ignore
          retention-days: 7
