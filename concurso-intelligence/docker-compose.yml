services:
  postgres:
    image: postgres:16-alpine
    container_name: concurso-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: concurso_intelligence
      POSTGRES_USER: concurso
      POSTGRES_PASSWORD: concurso_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurso -d concurso_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - concurso_intelligence_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concurso-intelligence-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://concurso:concurso_local@postgres:5432/concurso_intelligence?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required and must have at least 32 characters}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:-}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      PASSWORD_RESET_WEBHOOK_URL: ${PASSWORD_RESET_WEBHOOK_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      DATAPREV_LEGACY_ROOT: /legacy
    ports:
      - "3000:3000"
    volumes:
      - ../index.html:/legacy/index.html:ro
      - ../questions-1.js:/legacy/questions-1.js:ro
      - ../questions-2.js:/legacy/questions-2.js:ro
      - ../questions-3.js:/legacy/questions-3.js:ro
      - ../questions-4.js:/legacy/questions-4.js:ro
      - ../questions-5.js:/legacy/questions-5.js:ro
      - ../questions-6.js:/legacy/questions-6.js:ro
      - ../questions-7.js:/legacy/questions-7.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concurso-intelligence-worker
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://concurso:concurso_local@postgres:5432/concurso_intelligence?schema=public
      INGESTION_INBOX_DIR: /imports
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-60}
      INGESTION_ONESHOT: ${INGESTION_ONESHOT:-false}
    volumes:
      - ${INGESTION_IMPORT_DIR:-./imports}:/imports
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker:ingestion"]

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    container_name: concurso-intelligence-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:3000"]

  backup:
    image: postgres:16-alpine
    container_name: concurso-intelligence-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://concurso:concurso_local@postgres:5432/concurso_intelligence
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_ONESHOT: ${BACKUP_ONESHOT:-false}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    command: ["sh", "/usr/local/bin/postgres-backup.sh"]

volumes:
  concurso_intelligence_pgdata:
