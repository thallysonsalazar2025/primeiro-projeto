services:
  postgres:
    image: postgres:16-alpine
    container_name: concurso-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: concurso_intelligence
      POSTGRES_USER: concurso
      POSTGRES_PASSWORD: concurso_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurso -d concurso_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - concurso_intelligence_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concurso-intelligence-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://concurso:concurso_local@postgres:5432/concurso_intelligence?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-concurso-local-session-secret-change-me-2026}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:-concurso-local-rate-limit-secret-change-me-2026}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-concurso-local-ip-hash-secret-change-me-2026}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-concurso-local-password-reset-secret-change-me-2026}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  concurso_intelligence_pgdata:
